version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: listenlayer
      POSTGRES_PASSWORD: listenlayer
      POSTGRES_DB: listenlayer
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
